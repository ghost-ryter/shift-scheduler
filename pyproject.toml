[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-scheduler"
version = "0.1.0"
description = "Build restaurant shift schedules and calculate labor costs"
requires-python = ">=3.10"

[project.scripts]
shift-scheduler = "scheduler.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]